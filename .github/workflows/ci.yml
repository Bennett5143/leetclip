name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same PR/ref when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check

  # Stable status-check context ("check") that gates on the whole matrix, so
  # branch-protection rules don't need to track individual Node versions.
  check:
    name: check
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify build matrix succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "build matrix did not succeed: ${{ needs.build.result }}"
            exit 1
          fi
